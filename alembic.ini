# Alembic configuration for agent-props.
#
# This file lives at the repository root because `alembic init` writes it there
# and every alembic command looks for it in the working directory. The M0
# controller ruling assigns it to M3 for exactly that reason: it is generated,
# not authored, and the milestone that runs `alembic init` owns it.
#
# The migrations themselves live inside the package, at
# src/agentprops/storage/migrations, so a wheel carries them and a deployment
# can migrate its own database without a source checkout.
#
#   uv run alembic upgrade head          # apply every migration
#   uv run alembic check                 # does the schema match storage/sql.py?
#   uv run alembic revision --autogenerate -m "..."
#
# The database URL comes from the AGENTPROPS_DB_URL environment variable when
# it is set; `sqlalchemy.url` below is the fallback. env.py resolves that, not
# alembic, so the two commands above need no extra flags in normal use.

[alembic]
script_location = %(here)s/src/agentprops/storage/migrations
prepend_sys_path = src
path_separator = os

# Containerless mode, and what CI uses. Override with AGENTPROPS_DB_URL, or
# with `-x url=...` on the command line.
sqlalchemy.url = sqlite+pysqlite:///agentprops.db


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
