# Two profiles, and they are alternatives rather than layers.
#
#   docker compose --profile local up      service + Mongo. What a developer
#                                          authoring a new agent runs.
#   docker compose --profile shared up     service + Postgres. The shared
#                                          instance a team points at.
#
# Both publish the service on 8000, because a caller should not have to know
# which backend is behind it. Run one at a time.
#
# There is a third mode and it has no compose file: `--store ./agentprops.db`
# runs the service against a SQLite file with no container at all, and that is
# what CI uses (`docs/build-handoff.md` section 2).
#
# The two databases publish **non-default** host ports - Mongo on 27117 and
# Postgres on 5442 - and `tests/conftest.py`'s default test URLs dial exactly
# those, so the conformance suite can be run from the host against a container
# started here with no environment set at all:
#
#   docker compose --profile local up -d mongo
#   uv run pytest -m integration --store mongo
#
#   docker compose --profile shared up -d postgres
#   uv run pytest -m integration --store postgres
#
# **The ports are odd on purpose (ruling R-60).** Container-internal they are
# still 27017 and 5432; only what the host publishes moved. See below.
#
# Why 27117 and 5442 rather than 27017 and 5432 (ruling R-60)
# ------------------------------------------------------------
# A developer with a Postgres or a Mongo already running is the normal case, not
# an edge one - and this machine had both. It went wrong two ways, and only one
# of them looked like an error:
#
#   * on Windows a host Postgres bound to 0.0.0.0:5432 wins the race for IPv4
#     over Docker's port proxy, so the container is created, listening and
#     healthy while every connection lands on the other server, which answers
#     "password authentication failed" for a role it has never heard of;
#   * a host Mongo on 27017 answers *successfully*, so the suite **passes**
#     against a server nobody meant to test. Found by noticing an unrelated
#     database in `listDatabases`. It happened three times, the third to the
#     reviewer's own gate run, which returned a test count 14 higher than a
#     genuinely containerless one.
#
# The real cost was never the stray database: it was that the reported test
# count depended on what happened to be listening, which makes it evidence of
# very little. Overridable ports plus skip messages naming the URL was the first
# mitigation and it was insufficient - a *default* that can reach a foreign
# server is the problem. So the default moved. A foreign server on 27017 or 5432
# is now unreachable unless someone sets AGENTPROPS_MONGO_PORT /
# AGENTPROPS_POSTGRES_PORT or the matching AGENTPROPS_TEST_*_URL, which is a
# deliberate act.
#
# Rejected: a sentinel "is this our schema?" probe. It adds a round trip and a
# failure mode, and it still has to connect to the wrong server to discover the
# server is wrong. Picking a port nobody else uses ends the question.
#
# The conformance fixture still takes its database name from a constant and
# never from the URL, because it *drops* that database and a collision must not
# be able to drop someone else's. That belt stays whatever the port is.
#
#   AGENTPROPS_POSTGRES_PORT=5433 docker compose --profile shared up -d postgres
#   AGENTPROPS_TEST_POSTGRES_URL=postgresql://agentprops:agentprops@localhost:5433/agentprops
#   uv run pytest -m integration --store postgres
#
#   AGENTPROPS_MONGO_PORT=27018 docker compose --profile local up -d mongo
#   AGENTPROPS_TEST_MONGO_URL=mongodb://localhost:27018
#   uv run pytest -m integration --store mongo

name: agent-props

# The service is defined once and used twice, and the only difference between
# the two profiles is the store URL - which an anchor keeps *literally* true
# rather than nearly true. A copied-and-edited block is where two deployments
# quietly diverge.
#
# `AGENTPROPS_HTTP_HOST` and `AGENTPROPS_HTTP_PORT` are deliberately **not**
# here. YAML's `<<` merge key replaces a mapping rather than merging into it, so
# anything in an anchored `environment:` is discarded the moment a service
# declares one of its own - which both of these have to, for the store. Putting
# the two HTTP variables in the anchor would therefore have looked shared and
# been dead. They are set by the image instead (`ENV` in the Dockerfile), which
# is one place per variable and is also right for a bare `docker run`.
# `tests/unit/test_containers.py` asserts both halves: the image sets the HTTP
# pair, each service sets the store.
x-service: &service
  build:
    context: .
  restart: unless-stopped
  ports:
    - "${AGENTPROPS_SERVICE_PORT:-8000}:8000"

services:
  # ------------------------------------------------------------------ local
  service:
    <<: *service
    profiles: ["local"]
    environment:
      # Mongo needs no migration: contracts section 8 declares collections and
      # indexes, not DDL, and `MongoStore.create_schema()` declares the indexes
      # idempotently on startup. So this profile is genuinely one command.
      AGENTPROPS_STORE: mongodb://mongo:27017/agentprops
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    profiles: ["local"]
    image: mongo:8
    restart: unless-stopped
    ports:
      # 27117 on the host, 27017 inside. See the R-60 note above.
      - "${AGENTPROPS_MONGO_PORT:-27117}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # `depends_on: service_healthy` is what makes `up` a single command
      # rather than a race the service loses on a cold start. `mongosh --eval`
      # ships in the image; a TCP check would pass before the server accepts
      # queries.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ----------------------------------------------------------------- shared
  service-shared:
    <<: *service
    profiles: ["shared"]
    environment:
      AGENTPROPS_STORE: postgresql://agentprops:agentprops@postgres:5432/agentprops
    depends_on:
      postgres:
        condition: service_healthy
    # A Postgres database is **migrated, never created by the adapter**, which
    # is why this profile has a command and the local one does not:
    # `python -m agentprops.server` deliberately refuses to run `create_schema`
    # against a SQL URL, so that a real database is only ever changed by a
    # reviewed revision. `alembic upgrade head` is idempotent, so a restart
    # costs one `SELECT` against `alembic_version`.
    command:
      - sh
      - -c
      - >-
        alembic -x url="$${AGENTPROPS_STORE}" upgrade head
        && exec python -m agentprops.server --transport http

  postgres:
    profiles: ["shared"]
    image: postgres:17
    restart: unless-stopped
    ports:
      # 5442 on the host, 5432 inside. See the R-60 note above.
      - "${AGENTPROPS_POSTGRES_PORT:-5442}:5432"
    environment:
      POSTGRES_USER: agentprops
      POSTGRES_PASSWORD: agentprops
      POSTGRES_DB: agentprops
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `-U agentprops -d agentprops` and not the bare command: `pg_isready`
      # with no arguments answers for the *default* database, which reports
      # ready while the init scripts that create this one are still running.
      test: ["CMD-SHELL", "pg_isready -U agentprops -d agentprops"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # ------------------------------------------------------------------- otel
  # M10's first acceptance clause needs a **real** collector, so here is one.
  # Its own profile, because it is not an alternative to `local` or `shared` -
  # it is orthogonal, and a caller may want it beside either or neither:
  #
  #   docker compose --profile otel up -d otel-collector
  #   uv run pytest -m integration -k otel_collector
  #
  # Published on **4418**, not OTLP's default 4318, and that is ruling R-60
  # applied to a third protocol: a default that can reach a foreign server is
  # the defect. Any other collector on a developer's machine answers 4318, and a
  # clause-1 test that passed against someone else's collector would be worth
  # exactly as much as the Mongo run that passed against a foreign database.
  # Container-internal it is still 4318.
  #
  # `-contrib` rather than the core image because the `file` exporter lives
  # there. The test needs to *read the spans back and count them*, and the
  # `debug` exporter's stdout format is documented as unstable.
  otel-collector:
    profiles: ["otel"]
    image: otel/opentelemetry-collector-contrib:0.144.0
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      # 4418 on the host, 4318 inside. See the R-60 note above.
      - "${AGENTPROPS_OTLP_PORT:-4418}:4318"
      # The health-check extension, off its default 13133 for the same reason.
      - "${AGENTPROPS_OTLP_HEALTH_PORT:-13233}:13133"
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otel/config.yaml:ro
      - ./.otel:/data
    # The image runs as a non-root user, and the bind mount above has to be
    # writable by it for the file exporter to work. Docker Desktop's mounts are
    # permissive; on a native Linux host, `mkdir -p .otel && chmod 777 .otel`.
    user: "0:0"
    healthcheck:
      # The collector image is distroless - no shell, no curl, no wget - so a
      # command-based probe has nothing to run. The collector's own binary can
      # answer, and this is the documented way: `--help` exits 0 once the
      # process is up. The *test* probes the health endpoint over HTTP from the
      # host, which is the check that actually matters and the one whose URL the
      # skip message names.
      test: ["CMD", "/otelcol-contrib", "--help"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  mongo-data:
  postgres-data:
