[project]
name = "agentprops"
version = "0.1.0"
description = "Blueprint-driven narrative fixture service for agentic systems."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.2.0",
  "pydantic>=2.13.5",
  "jsonschema>=4.26.0",
  "sqlalchemy>=2.0.52",
  "alembic>=1.19.2",
  "pymongo>=4.18.0",
  "opentelemetry-sdk>=1.44.0",
  "opentelemetry-exporter-otlp>=1.44.0",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.16.6",
  "mypy>=2.3.1",
  "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentprops"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# ruff 0.16 formats fenced code blocks inside Markdown by default. docs/ holds
# the frozen specification (worked-example.md is the byte-exact source for
# tests/fixtures/); it must never be rewritten by a formatter pass. Scope
# ruff to the Python project only.
extend-exclude = ["docs", ".superpowers"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "N",   # pep8-naming
  "RUF", # ruff-specific rules
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
# `tests/` is checked too. The suites now carry real load - the R-04, layering
# and no-delete guards are AST walkers whose whole job is to be precise about
# node types - and typing them cost three fixes at M3, all of them latent bugs
# rather than annotation noise.
files = ["src", "tests"]
warn_unused_configs = true
show_error_codes = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: exercises a real storage backend (sqlite, postgres, or mongo); select a backend with --store",
]
